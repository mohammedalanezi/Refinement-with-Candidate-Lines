# ranges.conf
#
# Maps ranges of the command index "i" (1..6965) to the -r parameter and the number of hours that range is expected to need.
#
# Columns:  start  end   r   hours
#
# Rules are read top-to-bottom and the LAST matching row wins. Put your broad default first, then add more specific override rows below it for
# any range of i that needs a bigger r / more time.
#
# submit_batch.sh uses the "hours" column to decide whether an index is eligible for the current round (see --time below), so if you bump an
# override's hours up, just resubmit with a matching/larger --time and it will be picked up; everything already completed is skipped automatically.

# start  end    r   hours
0        6965   40  6

# Examples: edit/add rows like these for ranges that need more
# 1500     1800   45   4
# 4000     4250   50   5
